<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="title">
  <title id="title">Champaca</title>
  <!-- A champaca seen from the side, drawn after plate 191 of Blanco's Flora
       de Filipinas: narrow saffron tepals that spread loosely from a green
       cup and curl outward at the tips, the outer ones hanging low, on a
       short stem. -->
  <defs>
    <!-- one strap-shaped tepal pointing up from its base at 0,0; the tip
         curls right, and scale(-1 1) makes it curl left -->
    <path id="tepal" d="M0 0 C-2 -9 -3.4 -21 -2.8 -31 C-2.3 -38 0.2 -43.5 6 -46 C4 -41 2.5 -35 2.6 -29 C2.8 -19 2 -9 0 0 Z"/>
    <path id="rib" d="M0 -3 C-0.6 -14 -0.6 -25 0.4 -35"/>
    <linearGradient id="saffron" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FFC24A"/>
      <stop offset="0.5" stop-color="#F7921E"/>
      <stop offset="1" stop-color="#E4640A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FFE38A"/>
      <stop offset="0.55" stop-color="#FFB838"/>
      <stop offset="1" stop-color="#F38A18"/>
    </linearGradient>
  </defs>

  <!-- stem -->
  <path d="M63 80 C62 95 59 110 54 124" fill="none" stroke="#8C7A55" stroke-width="3.2" stroke-linecap="round"/>

  <!-- the bloom, enlarged about its base so it fills the frame -->
  <g transform="translate(63 74) scale(1.28) translate(-63 -88)">
  <!-- back tepals: long, saffron, at uneven angles; the outer ones droop -->
  <g fill="url(#saffron)" stroke="#C25A08" stroke-width="0.9" stroke-linejoin="round">
    <use href="#tepal" transform="translate(63 88) rotate(-128) scale(-0.8 0.8)"/>
    <use href="#tepal" transform="translate(63 88) rotate(-84) scale(-0.96 0.96)"/>
    <use href="#tepal" transform="translate(63 88) rotate(-38) scale(-1.08 1.08)"/>
    <use href="#tepal" transform="translate(63 88) rotate(-14) scale(-1.02 1.02)"/>
    <use href="#tepal" transform="translate(63 88) rotate(11) scale(1.1)"/>
    <use href="#tepal" transform="translate(63 88) rotate(36) scale(1.04)"/>
    <use href="#tepal" transform="translate(63 88) rotate(80) scale(0.94)"/>
    <use href="#tepal" transform="translate(63 88) rotate(124) scale(0.78)"/>
  </g>
  <!-- front tepals: shorter and paler -->
  <g fill="url(#gold)" stroke="#D27A0C" stroke-width="0.9" stroke-linejoin="round">
    <use href="#tepal" transform="translate(63 88) rotate(-27) scale(-0.78 0.78)"/>
    <use href="#tepal" transform="translate(63 88) rotate(-2) scale(0.86)"/>
    <use href="#tepal" transform="translate(63 88) rotate(24) scale(0.76)"/>
  </g>
  <g fill="none" stroke="#E07E10" stroke-width="0.8" stroke-linecap="round" opacity="0.6">
    <use href="#rib" transform="translate(63 88) rotate(-27) scale(-0.78 0.78)"/>
    <use href="#rib" transform="translate(63 88) rotate(-2) scale(0.86)"/>
    <use href="#rib" transform="translate(63 88) rotate(24) scale(0.76)"/>
  </g>

  <!-- the green cup the tepals rise from -->
  <path d="M56.5 86 C57 91 60 94 63 94 C66 94 69 91 69.5 86 C66 88 60 88 56.5 86 Z" fill="#7FA548" stroke="#4F7230" stroke-width="0.9" stroke-linejoin="round"/>
  </g>
</svg>

# champaca on Linux x86_64: bb test and the eight real libraries (bb libs) in
# ci/linux's image, the same command as on a workstation (`bb linux amd64`).
name: linux
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  linux-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: babashka 1.13.220
        run: |
          curl -fsSL -o /tmp/bb.tgz https://github.com/babashka/babashka/releases/download/v1.13.220/babashka-1.13.220-linux-amd64-static.tar.gz
          echo "eb3edd128276f0b6fbdefcb18dc7d42652a95ea409a81b34f08e36b8ac3cbc3c  /tmp/bb.tgz" | sha256sum -c -
          sudo tar xzf /tmp/bb.tgz -C /usr/local/bin bb
      - name: bb linux amd64
        run: bb linux amd64

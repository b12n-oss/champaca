# champaca on Linux x86_64: bb test and the eight real libraries (bb libs) in
# ci/linux's image, the same command as on a workstation (`bb linux amd64`).
# Runs on a push to main, on every pull request, and by hand from the Actions
# tab or `gh workflow run linux`. A run builds jolt from source, so it takes
# a while.
name: linux
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# a new push to a pull request cancels its older run; main runs every commit
concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  linux-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: babashka 1.13.220
        run: |
          curl -fsSL -o /tmp/bb.tgz https://github.com/babashka/babashka/releases/download/v1.13.220/babashka-1.13.220-linux-amd64-static.tar.gz
          echo "eb3edd128276f0b6fbdefcb18dc7d42652a95ea409a81b34f08e36b8ac3cbc3c  /tmp/bb.tgz" | sha256sum -c -
          sudo tar xzf /tmp/bb.tgz -C /usr/local/bin bb
      # the pinned jolt binary, built once per deps.edn and image (bb jolt skips
      # the build when it is there); everything else in the container's home
      # starts fresh. The key is computed here only and reused by the save:
      # bb linux downloads the JDK into ci/linux/cache/ during the run, so a
      # hash over all of ci/linux would differ by then.
      - name: restore the jolt build
        id: jolt
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/linux-home/.cache/champaca/jolt/*/jolt
          key: jolt-linux-amd64-${{ hashFiles('deps.edn', 'ci/linux/Dockerfile', 'ci/linux/layout.c') }}
      - name: bb linux amd64
        env:
          CHAMPACA_LINUX_HOME: ${{ runner.temp }}/linux-home
        run: bb linux amd64
      - name: own the container's files
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "${{ runner.temp }}/linux-home"
      - name: save the jolt build
        if: always() && steps.jolt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/linux-home/.cache/champaca/jolt/*/jolt
          key: ${{ steps.jolt.outputs.cache-primary-key }}

  # bb battery's other modes, one job each, in parallel: cold then warm on one
  # cache, the cache off, and CHAMPACA_BT=1 (bb libs runs in linux-amd64). The
  # same task as on a workstation, so CI and local runs mean the same thing;
  # macOS arm64 still needs a local bb battery.
  battery-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        modes: ["cold,warm", "cache-off", "bt"]
    steps:
      - uses: actions/checkout@v7
      - name: babashka 1.13.220
        run: |
          curl -fsSL -o /tmp/bb.tgz https://github.com/babashka/babashka/releases/download/v1.13.220/babashka-1.13.220-linux-amd64-static.tar.gz
          echo "eb3edd128276f0b6fbdefcb18dc7d42652a95ea409a81b34f08e36b8ac3cbc3c  /tmp/bb.tgz" | sha256sum -c -
          sudo tar xzf /tmp/bb.tgz -C /usr/local/bin bb
      - name: restore the jolt build
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/linux-home/.cache/champaca/jolt/*/jolt
          key: jolt-linux-amd64-${{ hashFiles('deps.edn', 'ci/linux/Dockerfile', 'ci/linux/layout.c') }}
      - name: bb battery (${{ matrix.modes }})
        env:
          CHAMPACA_LINUX_HOME: ${{ runner.temp }}/linux-home
          # git refuses a repository another user owns: /champaca is the
          # runner's checkout, the container runs as root
          CHAMPACA_LINUX_RUN: git config --global --add safe.directory '*' && BATTERY_MODES=${{ matrix.modes }} bb battery
        run: bb linux amd64


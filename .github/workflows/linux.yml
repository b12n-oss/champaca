# champaca on Linux x86_64 and arm64: the tests and the eight real libraries in
# ci/linux's image, the same command as on a workstation (`jolt linux amd64`,
# `bb linux arm64`), and the battery's other modes on x86_64.
# Runs on a push to main, on every pull request, and by hand from the Actions
# tab or `gh workflow run linux`. A run builds jolt from source, so it takes
# a while.
name: linux
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# a new push to a pull request cancels its older run; main runs every commit
concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  linux-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      # jolt's release binary runs the host's tasks (the image, the jars, docker);
      # inside the container the pinned jolt, built by tools/build-jolt.sh, runs
      # the tests
      - uses: jlt-commons/setup-jolt@v1
        with:
          version: "0.8.25"
      # the pinned jolt binary, built once per deps.edn, build script and image (build-jolt.sh skips
      # the build when it is there); everything else in the container's home
      # starts fresh. The key is computed here only and reused by the save:
      # jolt linux downloads the JDK into ci/linux/cache/ during the run, so a
      # hash over all of ci/linux would differ by then.
      - name: restore the jolt build
        id: jolt
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/linux-home/.cache/champaca/jolt/*/jolt
          key: jolt-linux-amd64-${{ hashFiles('deps.edn', 'tools/build-jolt.sh', 'ci/linux/Dockerfile', 'ci/linux/layout.c') }}
      - name: jolt linux amd64
        env:
          CHAMPACA_LINUX_HOME: ${{ runner.temp }}/linux-home
        run: jolt linux amd64
      - name: own the container's files
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "${{ runner.temp }}/linux-home"
      - name: save the jolt build
        if: always() && steps.jolt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/linux-home/.cache/champaca/jolt/*/jolt
          key: ${{ steps.jolt.outputs.cache-primary-key }}

  # The same on Linux arm64, natively on GitHub's arm64 runner. jolt has no
  # Linux arm64 release, so babashka runs the host's tasks from the same
  # bb.edn; the pinned jolt inside the container still runs the tests.
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: install babashka
        run: |
          v=1.13.220
          f=babashka-$v-linux-aarch64-static.tar.gz
          curl -fsSLo "$RUNNER_TEMP/$f" "https://github.com/babashka/babashka/releases/download/v$v/$f"
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: restore the jolt build
        id: jolt
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/linux-home/.cache/champaca/jolt/*/jolt
          key: jolt-linux-arm64-${{ hashFiles('deps.edn', 'tools/build-jolt.sh', 'ci/linux/Dockerfile', 'ci/linux/layout.c') }}
      - name: bb linux arm64
        env:
          CHAMPACA_LINUX_HOME: ${{ runner.temp }}/linux-home
        run: bb linux arm64
      - name: own the container's files
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "${{ runner.temp }}/linux-home"
      - name: save the jolt build
        if: always() && steps.jolt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/linux-home/.cache/champaca/jolt/*/jolt
          key: ${{ steps.jolt.outputs.cache-primary-key }}

  # jolt battery's other modes, one job each, in parallel: cold then warm on one
  # cache, and CHAMPACA_BT=1 (libs runs in linux-amd64 and linux-arm64). The
  # same task as on a workstation, so CI and local runs mean the same thing;
  # macOS runs in macos.yml. The cache-off mode boots the JDK from scratch for
  # every program (over 90 minutes here), so it runs on main and by hand only.
  battery-amd64:
    name: battery-amd64 (${{ matrix.modes }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        modes: ["cold,warm", "bt", "cache-off"]
        on-pr:
          - ${{ github.event_name == 'pull_request' }}
        exclude:
          - modes: cache-off
            on-pr: true
    steps:
      - uses: actions/checkout@v7
      # jolt's release binary runs the host's tasks (the image, the jars, docker);
      # inside the container the pinned jolt, built by tools/build-jolt.sh, runs
      # the tests
      - uses: jlt-commons/setup-jolt@v1
        with:
          version: "0.8.25"
      - name: restore the jolt build
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/linux-home/.cache/champaca/jolt/*/jolt
          key: jolt-linux-amd64-${{ hashFiles('deps.edn', 'tools/build-jolt.sh', 'ci/linux/Dockerfile', 'ci/linux/layout.c') }}
      - name: jolt battery (${{ matrix.modes }})
        env:
          CHAMPACA_LINUX_HOME: ${{ runner.temp }}/linux-home
          # git refuses a repository another user owns: /champaca is the
          # runner's checkout, the container runs as root
          CHAMPACA_LINUX_RUN: git config --global --add safe.directory '*' && BATTERY_MODES=${{ matrix.modes }} "$J" battery
        run: jolt linux amd64
      # jolt battery keeps each mode's output in target/battery/<tip>-<mode>.log
      - name: the failed mode's log
        if: failure()
        run: |
          for f in target/battery/*-*.log; do
            echo "::group::$f"; grep -E '^FAIL|passed' "$f" || true; tail -n 60 "$f"; echo "::endgroup::"
          done
          # each FAIL line and each log's last line as an annotation too, which
          # the checks API serves without the job log
          for f in target/battery/*-*.log; do
            [ -f "$f" ] || continue
            m=$(basename "$f" .log)
            grep -E '^FAIL' "$f" | head -n 8 | while IFS= read -r l; do echo "::error title=$m::$l"; done
            echo "::notice title=$m::$(tail -n 1 "$f")"
          done
          for h in target/hangs/* target/battery/*/target/hangs/*; do
            if [ -e "$h" ]; then echo "::error title=hang::$(basename "$h")"; fi
          done

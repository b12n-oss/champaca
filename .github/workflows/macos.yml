# champaca on macOS arm64: the battery's cold and warm modes and the eight real
# libraries, the same `jolt battery` as on a workstation. The pinned jolt is
# built with its own Chez (the runner has no system Chez), on OpenJDK 25.0.2,
# the JDK the Linux image uses.
# Runs on a push to main, on every pull request, and by hand from the Actions
# tab or `gh workflow run macos`.
name: macos
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# a new push to a pull request cancels its older run; main runs every commit
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  battery-macos-arm64:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - name: install OpenJDK 25.0.2
        run: |
          f=openjdk-25.0.2_macos-aarch64_bin.tar.gz
          curl -fsSLo "$RUNNER_TEMP/$f" "https://download.java.net/java/GA/jdk25.0.2/b1e0dfa218384cb9959bdcb897162d4e/10/GPL/$f"
          echo "7581b0d1752cd5acbf39e286c03f07b6cd6c205b562eb2fe753ff0253cf4c1bf  $RUNNER_TEMP/$f" | shasum -a 256 -c
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP"
          home="$RUNNER_TEMP/jdk-25.0.2.jdk/Contents/Home"
          echo "JAVA_HOME=$home" >> "$GITHUB_ENV"
          echo "$home/bin" >> "$GITHUB_PATH"
      # jolt's release binary runs the tasks; they need 0.8.26 for
      # System/mapLibraryName
      - uses: jlt-commons/setup-jolt@v1
        with:
          version: "0.8.26"
      - name: restore the jolt build
        id: jolt
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/champaca/jolt/*/jolt
          key: jolt-macos-arm64-${{ hashFiles('deps.edn', 'tools/build-jolt.sh') }}
      - name: build the pinned jolt
        run: sh tools/build-jolt.sh
      - name: save the jolt build
        if: steps.jolt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/champaca/jolt/*/jolt
          key: ${{ steps.jolt.outputs.cache-primary-key }}
      - name: fetch the libraries' jars
        run: jolt libs:fetch
      - name: jolt battery (cold,warm,libs)
        env:
          BATTERY_MODES: cold,warm,libs
        run: jolt battery
      # jolt battery keeps each mode's output in target/battery/<tip>-<mode>.log,
      # and a program that times out leaves target/hangs/<program>-<ms>/ with
      # its partial output and a macOS sample
      - name: the failed mode's log
        if: failure()
        run: |
          for f in target/battery/*-*.log; do
            echo "::group::$f"; grep -E '^FAIL|passed|matched' "$f" || true; tail -n 60 "$f"; echo "::endgroup::"
          done
      - name: keep the logs and any hang
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: macos-battery
          path: |
            target/battery/*.log
            target/battery/**/target/hangs/
            target/hangs/
          if-no-files-found: ignore

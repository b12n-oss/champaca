name: Site

# Builds the documentation site and publishes it to GitHub Pages. The build
# lives in jlt-commons/ci-builds, shared by every project; what stays here is
# this project's own: docs/, docs/site.edn, the base path below and the
# assertions in docs/check-site.sh.
#
# Builds on every pull request, and publishes to GitHub Pages from main.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Deploys must not race; pull request builds cancel their own earlier runs.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  site:
    uses: jlt-commons/ci-builds/.github/workflows/site.yml@main
    with:
      base-path: /champaca
      # Pinned rather than trusting the shared workflow's default. v0.4.4 is
      # the first release that copies the README's docs/images and renders
      # its GitHub alerts as callouts, which docs/check-site.sh checks; v0.4.5
      # builds on jolt v0.8.25 (its jolt-lang/time pin was too old). The
      # commit pinned here is v0.4.5 plus jlt-commons/docs-engine#7, which
      # points the README's docs/guide/*.md links at the built pages: on the
      # homepage each one was a 404. Move to the release that carries it.
      docs-engine-ref: 408bb617c9855b22b0cb423c308ecd1ee38c8c56
    permissions:
      contents: read
      pages: write
      id-token: write
